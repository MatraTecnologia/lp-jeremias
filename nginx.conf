# Consolidação SEO: domínios alternativos e www redirecionam (301) para o canônico
server {
    listen 80;
    server_name www.jeremiasmatra.com
                jeremiasmatra.com.br www.jeremiasmatra.com.br
                melhorgestordetrafego.com www.melhorgestordetrafego.com
                melhorgestordetrafego.com.br www.melhorgestordetrafego.com.br;

    return 301 https://jeremiasmatra.com$request_uri;
}

server {
    listen 80 default_server;
    server_name jeremiasmatra.com;

    root /usr/share/nginx/html;
    index index.html;

    # Astro gera URLs baseadas em diretório (foo/index.html)
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Assets com hash no nome — cache longo e imutável
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
